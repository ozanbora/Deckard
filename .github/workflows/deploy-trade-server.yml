# Publishes the trade server to the Azure App Service made by infra/azure/main.bicep (docs/deploy-azure.md).
# Run by hand (Actions > Deploy trade server > Run workflow), not on every push: a deploy restarts the server.
# Needs one repository secret, AZURE_WEBAPP_PUBLISH_PROFILE (the app's publish profile from the Azure portal), and
# one repository variable, AZURE_WEBAPP_NAME (e.g. deckard-trade).
name: Deploy trade server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Core and the API only: the app and the perception tests are Windows-only. The API's database tests need a
      # PostgreSQL (DECKARD_TRADE_TEST_DB) and are skipped without one.
      - name: Test
        run: |
          dotnet test tests/Deckard.Core.Tests
          dotnet test tests/Deckard.Trade.Tests

      - name: Publish
        run: dotnet publish src/Deckard.Trade.Api -c Release -o publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
